[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-radar"
version = "0.2.1"
description = "A local-first, explainable AI GitHub repository radar."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Xu Wenjie" }]
keywords = ["github", "ai", "recommendation", "fastapi", "htmx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
ai-repo-radar = "ai_repo_radar.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_repo_radar = ["templates/**/*.html", "static/**/*", "fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/ai_repo_radar/cli.py" = ["B008"]

[tool.coverage.run]
branch = true
source = ["ai_repo_radar"]

[tool.coverage.report]
show_missing = true
skip_covered = true
